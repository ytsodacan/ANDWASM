<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ANDWASM game</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0f17; color: #cfd6e4; font: 14px system-ui, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { max-width: 100vw; max-height: 100vh; aspect-ratio: 9 / 16; background: #000; display: block; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); min-width: 260px; padding: 12px 16px;
    background: rgba(17, 22, 33, .95); border: 1px solid rgba(255, 255, 255, .1); border-radius: 12px; text-align: center; }
  #toast.done { display: none; }
  #bar { height: 6px; margin-top: 8px; border-radius: 3px; background: #3b82f6; width: 0; transition: width .2s; }
</style>
</head>
<body>
<canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
<div id="toast"><span id="status">Loading…</span><div id="bar"></div></div>
<script src="andwasm-loader.js"></script>
</body>
</html>
